name: proof-of-play
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Kernel tests (node --test, zero deps)
        run: npm test
      - name: Proof-of-play mutation + fuzz gate (must be CLEAN)
        run: npm run gate
      - name: SaaS-tax demo (audit chain must verify)
        run: npm run demo
      - name: Agent-loop demo (every step gated, deterministic)
        run: npm run demo:agent
      - name: Desktop wiring smoke (shared page bridge, no Electron/GUI)
        run: node desktop/smoke.js

      # The live page inlines the real kernel. If someone edits index.html by hand, the page
      # people actually use stops being the code the gate proved — and nothing would say so.
      - name: Live page is still generated from the kernel (no hand edits)
        run: |
          node build-page.mjs
          git diff --exit-code index.html

      # The README prints a mutation score. A typed score decays silently; this fails the
      # build the moment the paragraph and a real run disagree.
      - name: README gate status matches a real run
        run: node konomi/sync-readme.mjs --check
